name: Report a correction
description: Flag a broken link, outdated role, closed program, or inaccurate description.
title: "Correction: "
labels: [correction]
body:
  - type: input
    id: page
    attributes:
      label: Page or listing URL
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What should change?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Current source URL
    validations:
      required: true
