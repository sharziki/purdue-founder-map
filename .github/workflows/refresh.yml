name: Refresh public events
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/scrape_navigator.py
      - run: python scripts/build_alumni.py
      - run: python scripts/build_data.py
      - run: python scripts/build_opportunities.py
      - run: python scripts/refresh_events.py
      - run: python scripts/build_catalog.py
      - run: python scripts/build_site.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/navigator.json data/founders.sqlite3 public/data.json public/alumni.json public/notable-alumni.json public/opportunities.json public/events.json public/founder-events.ics public/guide-data.json public/links.json public/catalog.json public/*.html public/guide/ public/playbooks/
          git diff --cached --quiet || (git commit -m 'Refresh founder events' && git push)
